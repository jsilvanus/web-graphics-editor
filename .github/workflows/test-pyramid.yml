name: Test Pyramid

on:
  push:
  workflow_dispatch:

concurrency:
  group: test-pyramid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    name: Read test manifest
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.manifest.outputs.unit }}
      model: ${{ steps.manifest.outputs.model }}
      integration: ${{ steps.manifest.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
      - id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          m=json.loads(Path("packages/graphics-editor/test-manifest.json").read_text())
          for floor in ("unit","model","integration"):
              suites=next(x["suites"] for x in m["floors"] if x["id"]==floor)
              print(f"{floor}=" + json.dumps(suites, separators=(",",":")))
          PY

  # Floor 1: every foundational suite runs independently.
  unit:
    name: Unit / ${{ matrix.suite }}
    needs: manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.manifest.outputs.unit) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @jsilvanus/graphics-editor vitest run "src/${{ matrix.suite }}*.test.ts"

  # Floor 2 runs only when the complete unit floor succeeds; its suites are independent.
  model:
    name: Model / ${{ matrix.suite }}
    needs: unit
    if: ${{ needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.manifest.outputs.model) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @jsilvanus/graphics-editor vitest run "src/${{ matrix.suite }}*.test.ts"

  # Floor 3 runs only when the complete model floor succeeds; its suites are independent.
  integration:
    name: Integration / ${{ matrix.suite }}
    needs: model
    if: ${{ needs.model.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.manifest.outputs.integration) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @jsilvanus/graphics-editor vitest run "src/*${{ matrix.suite }}*.test.ts"

  # Final package verification remains a single gate after all integration suites succeed.
  package:
    name: Package verification
    needs: integration
    if: ${{ needs.integration.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @jsilvanus/graphics-editor
      - run: npm test --workspace @jsilvanus/graphics-editor
      - run: npm run build --workspace @jsilvanus/graphics-editor
